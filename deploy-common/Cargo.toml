[package]
name = "deploy-common"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1.1.5"
tar = "0.4"
zstd = "0.14.0"
sha2 = "0.11.0"
