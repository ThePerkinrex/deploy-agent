[package]
name = "deploy-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
deploy-common = { path = "../deploy-common" }
axum = "0.8.9"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
anyhow = "1"
thiserror = "2.0.20"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
time = { version = "0.3", features = ["formatting"] }
tempfile = "3"
